name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check code
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run typecheck:tests
      - name: Build
        run: npm run build:all
      - name: Unit tests
        run: npm run test:unit
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@latest
      - name: Connection and recovery tests
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: >-
          npx --no-install vitest run
          tests/integration/firefox/command-timeout.test.ts
          tests/integration/firefox/connect-existing.test.ts
          tests/integration/firefox/tabs.test.ts
          tests/integration/firefox/bidi.test.ts
